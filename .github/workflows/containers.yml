name: Development containers
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t vardrmap-api:smoke backend
      - name: Verify backend migrations are packaged
        run: docker run --rm --network none --entrypoint alembic vardrmap-api:smoke heads
      - name: Build and verify frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://localhost:8443/backend -t vardrmap-web:smoke frontend
      - name: Verify retained OS backport sources in both runtime images
        run: |
          for image in vardrmap-api:smoke vardrmap-web:smoke; do
            docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
              --entrypoint sh "$image" -ec '
                for package in libacl1 libsqlite3-0 ncurses-bin util-linux; do
                  (cd "/usr/share/doc/$package/vardr-source" && sha256sum -c SHA256SUMS)
                done
                source=/usr/share/doc/libacl1/vardr-source
                grep -Fx "cp-path-substitution: EXPECTED_VULNERABLE" "$source/evidence/negative-controls.log"
                grep -Fx "tar-path-substitution: EXPECTED_VULNERABLE" "$source/evidence/negative-controls.log"
                grep -Fx "cp-path-substitution: PASS" "$source/evidence/stripped-payload-regressions.log"
                grep -Fx "tar-path-substitution: PASS" "$source/evidence/stripped-payload-regressions.log"
                cd /
                grep -hE "  ./usr/(bin/(cp|tar)|lib/[^/]+/libacl[.]so[.][0-9.]+)$" "$source"/*.files-SHA256SUMS > /tmp/acl-runtime-hashes
                test "$(wc -l < /tmp/acl-runtime-hashes)" -eq 3
                sha256sum -c /tmp/acl-runtime-hashes'
          done
