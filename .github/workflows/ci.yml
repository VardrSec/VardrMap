name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Dependency audit
        run: |
          pip install pip-audit
          # JWTs are verified with PyJWT (HS256/HMAC). python-jose was removed in v0.36.0
          # because of CVE-2026-85394 (unpatched HS256 algorithm-confusion forgery); dropping
          # it also removed the `ecdsa` transitive and its PYSEC-2026-1325 ignore.
          pip-audit -r requirements.txt

      - name: Migration consistency check
        run: |
          count=$(alembic heads 2>&1 | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Multiple migration heads detected ($count). Run 'alembic merge heads' to resolve."
            exit 1
          fi

  postgres:
    name: PostgreSQL migrations and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-fixture-password
          POSTGRES_DB: vardrmap_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI service only; application connections require TLS by default.
      TEST_DATABASE_URL: postgresql://postgres:ci-fixture-password@127.0.0.1:5432/vardrmap_test_ci?sslmode=disable
      INTEGRATION_DATABASE_URL: postgresql://postgres:ci-fixture-password@127.0.0.1:5432/vardrmap_test_integration?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      # Pin companion revisions so a PR is tested against a reproducible stack.
      - uses: actions/checkout@v7
        with:
          repository: VardrSec/VardrRunner
          ref: e8bc3064ac39cac32b0736980a1f34f2c8d6df3f
          path: .integration/runner
      - uses: actions/checkout@v7
        with:
          repository: VardrSec/VardrGate
          ref: af29a93140b54cf5b684a06f552a05cd92f6dee6
          path: .integration/gate
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v7
        with:
          go-version-file: .integration/gate/go.mod
          cache-dependency-path: .integration/gate/go.sum
      - name: Install test dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m venv .integration/runner-venv
          .integration/runner-venv/bin/pip install ./.integration/runner
      - name: Prepare disposable databases with a non-UTC default
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True) as conn:
              conn.execute("ALTER DATABASE vardrmap_test_ci SET timezone TO 'America/Chicago'")
              conn.execute('CREATE DATABASE vardrmap_test_integration')
              conn.execute("ALTER DATABASE vardrmap_test_integration SET timezone TO 'America/Chicago'")
          PY
      - name: Verify migrations and UTC connections
        run: python -m pytest backend/postgres_tests -v
      - name: Run backend suite on PostgreSQL
        working-directory: backend
        run: python -m pytest tests -v
      - name: Run Map to Runner to Gate on migrated PostgreSQL
        run: >-
          python scripts/integration/run.py --postgres --semantic-evidence --platform-readiness
          --runner .integration/runner --gate .integration/gate
          --runner-python .integration/runner-venv/bin/python
          --output "${{ runner.temp }}"
      - name: Retain integration verdict and source manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-integration-verdict
          path: |
            ${{ runner.temp }}/vardr-integration-*/acceptance-results.json
            ${{ runner.temp }}/vardr-integration-*/sources.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated test dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise real UI against disposable backend
        working-directory: frontend
        run: npm run test:e2e
      - name: Exercise local authentication over disposable HTTPS
        working-directory: frontend
        run: npm run test:e2e:local
      - name: Install Firefox for focused CSP compatibility
        working-directory: frontend
        run: npx playwright install --with-deps firefox
      - name: Verify nonce-based report-only CSP in Firefox
        working-directory: frontend
        run: npx playwright test --config playwright.csp-firefox.config.ts e2e/engagement.spec.ts --grep "unauthenticated browser presents GitHub login"
      - name: Retain failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-acceptance-failure
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    strategy:
      # Run every Node leg to completion so one version's failure does not mask
      # the other's result.
      fail-fast: false
      matrix:
        # 20 = current production runtime (.nvmrc / Vercel); 24 = the new
        # GitHub-hosted runner default after the 2026-06-16 flip. Testing both
        # catches a Node-version regression before it reaches production.
        node-version: ["20", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` only type-checks what the app graph reaches, and ts-jest
      # transpiles without checking, so nothing here ever type-checked the test
      # files — three fixtures had drifted from their types since v0.14.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          BACKEND_JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Dependency audit
        # Audit production dependencies only. Dev/build-only tooling (eslint
        # plugins, jest/babel) pulls transitive advisories that are unpatched
        # upstream (e.g. the braces stack-exhaustion DoS via
        # @next/eslint-plugin-next) and never ship to the running app, so they
        # must not block every merge. Anything in the deployed bundle is still
        # gated at high severity.
        run: npm audit --omit=dev --audit-level=high

  burp-extension:
    name: Burp extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vardr-burp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # v5 currently fails while resolving pinned distributions when the
      # versions service returns an HTML error page; v4's downloader is stable.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build extension JAR
        run: gradle jar

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks *binary* is MIT; only the gitleaks-action wrapper requires a
      # paid licence on organisation repos, which is what broke this job — the
      # floating @v3 tag started enforcing it mid-July with no commit of ours.
      # Installing the release directly keeps the scan free and pins the version
      # so the tool cannot change underneath us again.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history for secrets
        run: gitleaks git . --redact --verbose --no-banner
