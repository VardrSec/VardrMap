name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Dependency audit
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 (CVE-2024-23342): Minerva timing side-channel in the pure-Python
          # `ecdsa` package, a hard transitive dependency of python-jose with no fixed release.
          # Not reachable here — VardrMap signs/verifies JWTs with HS256 (HMAC) only, which
          # never exercises ecdsa. Revisit if we ever adopt EC-based JWTs or python-jose ships a fix.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Migration consistency check
        run: |
          count=$(alembic heads 2>&1 | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Multiple migration heads detected ($count). Run 'alembic merge heads' to resolve."
            exit 1
          fi

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    strategy:
      # Run every Node leg to completion so one version's failure does not mask
      # the other's result.
      fail-fast: false
      matrix:
        # 20 = current production runtime (.nvmrc / Vercel); 24 = the new
        # GitHub-hosted runner default after the 2026-06-16 flip. Testing both
        # catches a Node-version regression before it reaches production.
        node-version: ["20", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` only type-checks what the app graph reaches, and ts-jest
      # transpiles without checking, so nothing here ever type-checked the test
      # files — three fixtures had drifted from their types since v0.14.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          BACKEND_JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Dependency audit
        run: npm audit --audit-level=high

  burp-extension:
    name: Burp extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vardr-burp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # v5 currently fails while resolving pinned distributions when the
      # versions service returns an HTML error page; v4's downloader is stable.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build extension JAR
        run: gradle jar

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks *binary* is MIT; only the gitleaks-action wrapper requires a
      # paid licence on organisation repos, which is what broke this job — the
      # floating @v3 tag started enforcing it mid-July with no commit of ours.
      # Installing the release directly keeps the scan free and pins the version
      # so the tool cannot change underneath us again.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history for secrets
        run: gitleaks git . --redact --verbose --no-banner
