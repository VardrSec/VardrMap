name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Migration consistency check
        run: |
          count=$(alembic heads 2>&1 | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Multiple migration heads detected ($count). Run 'alembic merge heads' to resolve."
            exit 1
          fi

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    strategy:
      # Run every Node leg to completion so one version's failure does not mask
      # the other's result.
      fail-fast: false
      matrix:
        # 20 = current production runtime (.nvmrc / Vercel); 24 = the new
        # GitHub-hosted runner default after the 2026-06-16 flip. Testing both
        # catches a Node-version regression before it reaches production.
        node-version: ["20", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-placeholder-secret-not-used-in-prod
          AUTH_GITHUB_ID: ci-placeholder
          AUTH_GITHUB_SECRET: ci-placeholder
          BACKEND_JWT_SECRET: ci-placeholder-secret-not-used-in-prod
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Dependency audit
        run: npm audit --audit-level=high

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
